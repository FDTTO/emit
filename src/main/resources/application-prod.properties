server.forward-headers-strategy=native
app.openapi.server-url=https://${RAILWAY_PUBLIC_DOMAIN}

emit.kafka.topic.replicas=3

# ----------------------------------------------------------------
# HIKARICP - Connection Pool
#
# Sizing for I/O-bound multi-tenant workload with Kafka consumers.
# Formula: cores * (1 + wait_ratio/compute_ratio).
# Override DB_POOL_SIZE for larger deployments (default: 20).
# ----------------------------------------------------------------
spring.datasource.hikari.pool-name=EmitHikariPool-Prod
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

emit.security.jwt.secret=${EMIT_SECURITY_JWT_SECRET}
emit.security.jwt.expiration-ms=${EMIT_SECURITY_JWT_EXPIRATION_MS}
emit.admin.username=${EMIT_ADMIN_USERNAME}
emit.admin.password=${EMIT_ADMIN_PASSWORD}
