# Defaults for every profile. Secrets never live here: each profile, or the
# environment, provides them.

spring.application.name=emit
server.port=${PORT:8080}

# One language for every response. Without a fixed locale, validation
# messages follow the caller's Accept-Language or the host's default.
spring.web.locale=en
spring.web.locale-resolver=fixed

# ----------------------------------------------------------------
# PERSISTENCE
# ----------------------------------------------------------------
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.default-schema=public

# none, not validate: Liquibase owns the schema, and the documents table
# lives only in each tenant's schema, so validating public fails at startup.
spring.jpa.hibernate.ddl-auto=none

# Closed with the service call, not the request: open, JSON serialization
# could lazy-load while holding a pool connection.
spring.jpa.open-in-view=false

# The resolvers are registered in MultitenancyConfig.
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ----------------------------------------------------------------
# RATE LIMITING
# ----------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Every tenant request asks the limiter first; a Redis that stops answering
# refuses it in two seconds instead of holding it a minute.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

emit.rate-limit.requests-per-minute=20

# ----------------------------------------------------------------
# KAFKA
# ----------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# generate answers 202 only once every in-sync replica holds the event. The
# client defaults would hold the request up to 60s for metadata and 120s for
# delivery; a broker that does not confirm within seconds gets a 503 instead.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=4000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=4000
emit.kafka.ack-timeout=5s
spring.kafka.consumer.group-id=emit-pdf-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.emit.document.domain

emit.kafka.topic.document-generation=document.generation.requested

# ----------------------------------------------------------------
# SPRINGDOC / SWAGGER UI
# ----------------------------------------------------------------
# The spec is published as OpenAPI 3.0: client generators and contract tools
# support it fully, and the console is drawn on Swagger UI's 3.0 rendering.
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.doc-expansion=list

# The theme removes the tag filter, so the control is disabled here rather
# than hidden in CSS: a hidden input still takes focus from the keyboard.
springdoc.swagger-ui.filter=false

springdoc.swagger-ui.display-request-duration=true

# Every operation opens ready to execute, rather than with inert inputs until
# a button is pressed.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# nord, not monokai: the highlighter writes token colours inline, so the theme
# is the only lever over them, and monokai's are far more saturated than the page.
springdoc.swagger-ui.syntax-highlight.theme=nord
