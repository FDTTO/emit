# ================================================================
# application.properties - SHARED VALUES (all profiles)
#
# RULE: this file contains only non-sensitive defaults.
# Credentials, secrets, and environment-specific settings
# belong in application-{profile}.properties or environment variables.
#
# In production: spring.datasource.password NEVER goes in a file.
# Use: SPRING_DATASOURCE_PASSWORD=xxx (env var) or Spring Cloud Config.
# ================================================================

spring.application.name=emit
server.port=${PORT:8080}
spring.profiles.active=dev

# Liquibase: active in all profiles to ensure schema is up to date
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.default-schema=public

# JPA: validate = Hibernate checks the schema on startup, never alters it.
# If schema != entities, fails immediately with a clear message.
# Better to catch it at deploy time than on the first production query.
spring.jpa.hibernate.ddl-auto=none

# open-in-view=false: EntityManager (and pool connection) closed at the end
# of the service layer, not at the end of the HTTP request.
# With true (Spring Boot default), JSON serialization can trigger
# lazy loads while holding a HikariCP connection - pool exhaustion.
spring.jpa.open-in-view=false

# Actuator: health always available for load balancer / k8s health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ----------------------------------------------------------------
# CACHE / RATE LIMITING
#
# Redis is the shared store for the sliding-window rate limiter.
# Every application instance reads and writes the same sorted sets
# so the limit is enforced globally across horizontal replicas.
# REDIS_HOST / REDIS_PORT are overridden in production via env vars.
# ----------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

emit.rate-limit.requests-per-minute=20

# ----------------------------------------------------------------
# KAFKA
# ----------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=emit-pdf-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.emit.domain.document
