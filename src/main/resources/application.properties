# ================================================================
# application.properties — VALORES COMPARTILHADOS (todos os perfis)
#
# REGRA: este arquivo contém apenas defaults não-sensíveis.
# Credenciais, secrets e configurações específicas de ambiente
# vão em application-{profile}.properties ou variáveis de ambiente.
#
# Em produção real: spring.datasource.password NUNCA vai em arquivo.
# Use: SPRING_DATASOURCE_PASSWORD=xxx (env var) ou Spring Cloud Config.
# ================================================================

spring.application.name=emit
server.port=8080
spring.profiles.active=dev

# Liquibase: ativo em todos os perfis para garantir schema atualizado
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.default-schema=public

# JPA: validate = Hibernate verifica schema no startup, nunca altera
# Se schema != entidades, falha imediatamente com mensagem clara.
# Melhor descobrir no deploy do que na primeira query de produção.
spring.jpa.hibernate.ddl-auto=none

# open-in-view=false: EntityManager (e conexão do pool) fechada ao fim
# da camada de serviço, não ao fim do request HTTP.
# Com true (default Spring Boot), serialização JSON pode disparar
# lazy loads enquanto segura uma conexão do HikariCP — pool exhaustion.
spring.jpa.open-in-view=false

# Actuator: health sempre disponível para health checks de load balancer/k8s
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
