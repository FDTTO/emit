# ================================================================
# application.properties - SHARED VALUES (all profiles)
#
# RULE: this file contains only non-sensitive defaults.
# Credentials, secrets, and environment-specific settings
# belong in application-{profile}.properties or environment variables.
#
# In production: spring.datasource.password NEVER goes in a file.
# Use: SPRING_DATASOURCE_PASSWORD=xxx (env var) or Spring Cloud Config.
# ================================================================

spring.application.name=emit
server.port=${PORT:8080}

# One language for every response. Without a fixed locale, validation
# messages follow the caller's Accept-Language or the host's default, so the
# same request answers in Portuguese on one machine and English on another.
spring.web.locale=en
spring.web.locale-resolver=fixed

# Liquibase: active in all profiles to ensure schema is up to date
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.default-schema=public

# JPA: validate = Hibernate checks the schema on startup, never alters it.
# If schema != entities, fails immediately with a clear message.
# Better to catch it at deploy time than on the first production query.
spring.jpa.hibernate.ddl-auto=none

# open-in-view=false: EntityManager (and pool connection) closed at the end
# of the service layer, not at the end of the HTTP request.
# With true (Spring Boot default), JSON serialization can trigger
# lazy loads while holding a HikariCP connection - pool exhaustion.
spring.jpa.open-in-view=false

# Hibernate multi-tenancy strategy: each tenant mapped to its own PostgreSQL schema.
# Resolvers are registered programmatically in MultitenancyConfig.
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Actuator: health always available for load balancer / k8s health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ----------------------------------------------------------------
# CACHE / RATE LIMITING
#
# Redis is the shared store for the sliding-window rate limiter.
# Every application instance reads and writes the same sorted sets
# so the limit is enforced globally across horizontal replicas.
# REDIS_HOST / REDIS_PORT are overridden in production via env vars.
# ----------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Every tenant request asks the limiter first; a Redis that stops answering
# refuses it in two seconds instead of holding it a minute.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

emit.rate-limit.requests-per-minute=20

# ----------------------------------------------------------------
# KAFKA
# ----------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# generate answers 202 only once every in-sync replica holds the event. The
# client defaults would hold the request up to 60s for metadata and 120s for
# delivery; a broker that does not confirm within seconds gets a 503 instead.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=4000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=4000
emit.kafka.ack-timeout=5s
spring.kafka.consumer.group-id=emit-pdf-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.emit.document.domain

emit.kafka.topic.document-generation=document.generation.requested

# ----------------------------------------------------------------
# SPRINGDOC / SWAGGER UI
# ----------------------------------------------------------------
# The spec is published as OpenAPI 3.0: client generators and contract tools
# support it fully, and the console is drawn on Swagger UI's 3.0 rendering.
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.doc-expansion=list

# The theme removes the tag filter, so the control is disabled here rather
# than hidden in CSS: a hidden input still takes focus from the keyboard.
springdoc.swagger-ui.filter=false

springdoc.swagger-ui.display-request-duration=true

# Every operation opens ready to execute. A console whose inputs are inert
# until a button is pressed makes the reader click once per operation for
# nothing in return.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# nord, not monokai. The highlighter writes token colours as inline styles,
# so the theme is the only lever over them, and monokai's neon green and
# magenta are several steps more saturated than anything else on the page.
springdoc.swagger-ui.syntax-highlight.theme=nord
