# Local development against docker-compose.yml. Diagnostics here expose data
# and cost performance: none of it belongs in production.

# ----------------------------------------------------------------
# DATASOURCE
# ----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/emit_db
spring.datasource.username=emit_user
spring.datasource.password=emit_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=EmitHikariPool-Dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Logs who acquired any connection held over 2s: finds missing releases and
# long transactions, but legitimately slow work trips it too.
spring.datasource.hikari.leak-detection-threshold=2000

# ----------------------------------------------------------------
# JPA / HIBERNATE
# ----------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=true

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ----------------------------------------------------------------
# LIQUIBASE
# ----------------------------------------------------------------
spring.liquibase.enabled=true

# ----------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------
logging.level.dev.emit=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Prints every bound parameter value, API key hashes and document content included.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.org.springframework.security=DEBUG

# ----------------------------------------------------------------
# ACTUATOR
# ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,hikaricp
management.endpoint.health.show-details=always

# ----------------------------------------------------------------
# SECURITY
# ----------------------------------------------------------------
# HMAC-SHA256 refuses a key shorter than 256 bits: at least 32 characters.
emit.security.jwt.secret=emit-dev-secret-minimum-32-characters-long!
emit.security.jwt.expiration-ms=86400000

emit.admin.username=admin
emit.admin.password=admin123

# ----------------------------------------------------------------
# SPRINGDOC / SWAGGER UI
# ----------------------------------------------------------------
# Keeps the token across reloads in the browser's local storage: a fair trade
# for a console used to try the API, not for one in front of production data.
springdoc.swagger-ui.persist-authorization=true

# Follows server.port, so a second instance on another port documents itself.
app.openapi.server-url=http://localhost:${server.port}
app.openapi.server-description=Local development
