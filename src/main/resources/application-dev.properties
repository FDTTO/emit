# ================================================================
# application-dev.properties — PERFIL DE DESENVOLVIMENTO
#
# Ativado com: SPRING_PROFILES_ACTIVE=dev
# ou na IDE: VM options → -Dspring.profiles.active=dev
#
# Configurações aqui: máxima visibilidade, diagnóstico agressivo,
# thresholds baixos para detectar problemas cedo.
# NUNCA copiar estas flags para produção.
# ================================================================

# ----------------------------------------------------------------
# DATASOURCE — aponta para o PostgreSQL do docker-compose.yml
# ----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/emit_db
spring.datasource.username=emit_user
spring.datasource.password=emit_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------
# HIKARICP — Connection Pool
#
# Teoria: HikariCP usa ConcurrentBag com 3 camadas:
#   1. ThreadLocal cache (zero contenção — a maioria das operações)
#   2. CAS lock-free na bag compartilhada
#   3. LockSupport.parkNanos() quando pool esgotado (thread dorme)
#
# Dimensionamento para dev local: valores conservadores.
# Fórmula produção (I/O-bound): cores * (1 + wait_ratio/compute_ratio)
# ----------------------------------------------------------------
spring.datasource.hikari.pool-name=EmitHikariPool-Dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# connectionTimeout: tempo máximo que uma thread espera por uma
# connection livre. Após este tempo: SQLTimeoutException.
# 30s em dev é generoso. Em prod: 5-10s para fail-fast.
spring.datasource.hikari.connection-timeout=30000

# idleTimeout: conexão ociosa por este tempo é fechada e removida
# do pool (desde que acima de minimum-idle). PostgreSQL pode encerrar
# conexões ociosas no servidor — idleTimeout garante renovação proativa.
spring.datasource.hikari.idle-timeout=600000

# maxLifetime: conexão encerrada após este tempo independente de uso.
# Essencial em cloud: firewalls NAT (AWS, Azure) encerram TCP idle
# após 5-15min silenciosamente. maxLifetime < NAT timeout.
spring.datasource.hikari.max-lifetime=1800000

# keepaliveTime: envia SELECT 1 periodicamente para manter TCP ativo
# através de firewalls e NAT routers.
spring.datasource.hikari.keepalive-time=60000

# Valida que a connection está funcional antes de entregar ao thread.
spring.datasource.hikari.connection-test-query=SELECT 1

# leak-detection-threshold: APENAS EM DEV.
# Se uma connection ficar checked out por mais de 2s, Hikari loga
# WARNING com stack trace de quem a obteve.
# Detecta: transações longas, finally blocks faltando, N+1 queries.
# NUNCA em produção — overhead + falsos positivos em ops legítimas lentas.
spring.datasource.hikari.leak-detection-threshold=2000

# ----------------------------------------------------------------
# JPA / HIBERNATE — visibilidade máxima para diagnóstico
# ----------------------------------------------------------------

# show-sql: imprime SQL no stdout (não no log framework).
# Útil para ver queries rapidamente, mas não filtrável por log level.
spring.jpa.show-sql=true

# format_sql: indenta o SQL para leitura humana. Só útil com show-sql=true.
spring.jpa.properties.hibernate.format_sql=true

# use_sql_comments: adiciona comentário antes de cada SQL indicando
# qual método de repositório ou @Query o gerou.
# Exemplo: /* load dev.emit.domain.tenant.Tenant */ select ...
spring.jpa.properties.hibernate.use_sql_comments=true

# generate_statistics: coleta contadores em memória por session:
#   - queryExecutionCount: total de queries
#   - entityFetchCount: se >> queryExecutionCount → N+1 detectado
#   - collectionFetchCount: lazy loads de coleções
#   - queryExecutionMaxTime: query mais lenta em ms
# Acesse via: emf.unwrap(SessionFactory.class).getStatistics()
spring.jpa.properties.hibernate.generate_statistics=true

# Batch size: acumula N INSERTs/UPDATEs antes de enviar ao banco.
# Sem batch: 1000 entidades = 1000 round-trips.
# Com batch_size=25: 1000 entidades = 40 round-trips.
# order_inserts/updates: OBRIGATÓRIO para batch funcionar com JPA.
# Agrupa todas as operações do mesmo tipo antes de enviar em batch.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# ----------------------------------------------------------------
# LIQUIBASE
# ----------------------------------------------------------------
spring.liquibase.enabled=true

# ----------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------

# Log do próprio código do EMIT em DEBUG
logging.level.dev.emit=DEBUG

# Log das queries SQL geradas pelo Hibernate (mais granular que show-sql)
logging.level.org.hibernate.SQL=DEBUG

# Log dos valores dos parâmetros bind (os ? nas queries)
# Cuidado: expõe dados sensíveis nos logs. NUNCA em produção.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log interno do HikariCP — mostra criação/destruição de connections,
# estados de PENDING/ACTIVE/IDLE. Muito verboso. Use só ao diagnosticar.
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Log do Spring Security — mostra decisões de autorização/autenticação.
# Essencial para debugar por que um request está sendo bloqueado.
logging.level.org.springframework.security=DEBUG

# ----------------------------------------------------------------
# ACTUATOR — expõe métricas do pool em /actuator/metrics/hikaricp.*
# ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,hikaricp
management.endpoint.health.show-details=always

# ----------------------------------------------------------------
# ASYNC — configuração base do ThreadPoolTaskExecutor padrão do Spring.
# O EMIT sobrescreve isso em AsyncConfig.java com o docProcessorExecutor
# dedicado e TenantContextDecorator.
# ----------------------------------------------------------------
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=emit-task-

# ----------------------------------------------------------------
# JWT — dev only. Em produção: variável de ambiente ou Vault.
# Mínimo de 32 chars para HMAC-SHA256 (256 bits de entropia).
# ----------------------------------------------------------------
emit.security.jwt.secret=emit-dev-secret-minimum-32-characters-long!
emit.security.jwt.expiration-ms=86400000

emit.admin.username=admin
emit.admin.password=admin123
