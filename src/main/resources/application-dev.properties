# ================================================================
# application-dev.properties - DEVELOPMENT PROFILE
#
# Activated with: SPRING_PROFILES_ACTIVE=dev
# or in the IDE: VM options → -Dspring.profiles.active=dev
#
# Settings here: maximum visibility, aggressive diagnostics,
# low thresholds to catch problems early.
# NEVER copy these flags to production.
# ================================================================

# ----------------------------------------------------------------
# DATASOURCE - points to the PostgreSQL instance in docker-compose.yml
# ----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/emit_db
spring.datasource.username=emit_user
spring.datasource.password=emit_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------
# HIKARICP - Connection Pool
#
# HikariCP uses ConcurrentBag with 3 layers:
#   1. ThreadLocal cache (zero contention - most operations)
#   2. CAS lock-free on the shared bag
#   3. LockSupport.parkNanos() when pool is exhausted (thread parks)
#
# Dev sizing: conservative values.
# Production formula (I/O-bound): cores * (1 + wait_ratio/compute_ratio)
# ----------------------------------------------------------------
spring.datasource.hikari.pool-name=EmitHikariPool-Dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# connectionTimeout: max time a thread waits for a free connection.
# After this time: SQLTimeoutException.
# 30s is generous for dev. In prod: 5-10s for fail-fast.
spring.datasource.hikari.connection-timeout=30000

# idleTimeout: idle connection closed after this time if above minimum-idle.
# PostgreSQL may close idle connections server-side - idleTimeout ensures
# proactive renewal.
spring.datasource.hikari.idle-timeout=600000

# maxLifetime: connection closed after this time regardless of usage.
# Essential in cloud: NAT firewalls (AWS, Azure) silently kill TCP idle
# after 5-15min. maxLifetime must be < NAT timeout.
spring.datasource.hikari.max-lifetime=1800000

# keepaliveTime: sends SELECT 1 periodically to keep TCP alive
# through firewalls and NAT routers.
spring.datasource.hikari.keepalive-time=60000

# Validates the connection is functional before handing it to a thread.
spring.datasource.hikari.connection-test-query=SELECT 1

# leak-detection-threshold: DEV ONLY.
# If a connection stays checked out for more than 2s, Hikari logs a
# WARNING with the stack trace of who acquired it.
# Detects: long transactions, missing finally blocks, N+1 queries.
# NEVER in production - overhead + false positives on legitimately slow ops.
spring.datasource.hikari.leak-detection-threshold=2000

# ----------------------------------------------------------------
# JPA / HIBERNATE - maximum visibility for diagnostics
# ----------------------------------------------------------------

# show-sql: prints SQL to stdout (not to the log framework).
# Useful for quick query inspection, but not filterable by log level.
spring.jpa.show-sql=true

# format_sql: indents SQL for human readability. Only useful with show-sql=true.
spring.jpa.properties.hibernate.format_sql=true

# use_sql_comments: adds a comment before each SQL indicating which
# repository method or @Query generated it.
# Example: /* load dev.emit.domain.tenant.Tenant */ select ...
spring.jpa.properties.hibernate.use_sql_comments=true

# generate_statistics: collects in-memory counters per session:
#   - queryExecutionCount: total queries
#   - entityFetchCount: if >> queryExecutionCount → N+1 detected
#   - collectionFetchCount: lazy collection loads
#   - queryExecutionMaxTime: slowest query in ms
# Access via: emf.unwrap(SessionFactory.class).getStatistics()
spring.jpa.properties.hibernate.generate_statistics=true

# Batch size: accumulates N INSERTs/UPDATEs before sending to the database.
# Without batch: 1000 entities = 1000 round-trips.
# With batch_size=25: 1000 entities = 40 round-trips.
# order_inserts/updates: REQUIRED for batching to work with JPA.
# Groups all operations of the same type before sending in batch.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# ----------------------------------------------------------------
# LIQUIBASE
# ----------------------------------------------------------------
spring.liquibase.enabled=true

# ----------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------

# EMIT application code at DEBUG level
logging.level.dev.emit=DEBUG

# SQL queries generated by Hibernate (more granular than show-sql)
logging.level.org.hibernate.SQL=DEBUG

# Bind parameter values (the ? placeholders in queries).
# Warning: exposes sensitive data in logs. NEVER in production.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# HikariCP internals - shows connection creation/destruction,
# PENDING/ACTIVE/IDLE states. Very verbose. Use only when diagnosing pool issues.
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Spring Security - shows authorization/authentication decisions.
# Essential for debugging why a request is being blocked.
logging.level.org.springframework.security=DEBUG

# ----------------------------------------------------------------
# ACTUATOR - exposes pool metrics at /actuator/metrics/hikaricp.*
# ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,hikaricp
management.endpoint.health.show-details=always

# ----------------------------------------------------------------
# ASYNC - base configuration for Spring's default ThreadPoolTaskExecutor.
# EMIT overrides this in AsyncConfig.java with the dedicated
# docProcessorExecutor and TenantContextDecorator.
# ----------------------------------------------------------------
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=emit-task-

# ----------------------------------------------------------------
# JWT - dev only. In production: environment variable or Vault.
# Minimum 32 chars for HMAC-SHA256 (256 bits of entropy).
# ----------------------------------------------------------------
emit.security.jwt.secret=emit-dev-secret-minimum-32-characters-long!
emit.security.jwt.expiration-ms=86400000

emit.admin.username=admin
emit.admin.password=admin123
