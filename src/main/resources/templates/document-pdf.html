<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .header {
            border-bottom: 3px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        .brand span {
            color: #3498db;
        }

        .document-title {
            font-size: 20px;
            margin-top: 10px;
            color: #555;
        }

        .meta {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-left: 4px solid #3498db;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .meta-row {
            margin-bottom: 5px;
        }

        .meta-label {
            font-weight: bold;
            color: #555;
        }

        .content-section {
            line-height: 1.7;
            font-size: 14px;
        }

        .footer {
            margin-top: 60px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 11px;
            color: #999;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            background-color: #e8f4f8;
            color: #2980b9;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="brand">EM<span>IT</span></div>
        <div class="document-title" th:text="${document.title}">Título do Documento</div>
    </div>

    <div class="meta">
        <div class="meta-row">
            <span class="meta-label">ID: </span>
            <span th:text="${document.id}">uuid</span>
        </div>
        <div class="meta-row">
            <span class="meta-label">Status: </span>
            <span class="status-badge" th:text="${document.status}">PENDING</span>
        </div>
        <div class="meta-row">
            <span class="meta-label">Gerado em: </span>
            <span th:text="${generatedAt}">2026-01-01</span>
        </div>
    </div>

    <div class="content-section">
        <p th:text="${document.content}">Conteúdo do documento aparece aqui.</p>
    </div>

    <div class="footer">
        Gerado pelo EMIT — Motor de Processamento de Documentos
    </div>

</body>

</html>
