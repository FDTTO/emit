# ================================================================
# application-test.properties - TEST PROFILE
#
# Used by @SpringBootTest in integration test suites with Testcontainers.
# The real database is provisioned by Testcontainers (PostgreSQL in Docker).
# The database URL is injected dynamically via @DynamicPropertySource.
# ================================================================

# Liquibase runs against the Testcontainers PostgreSQL instance.
spring.liquibase.enabled=true

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

logging.level.dev.emit=INFO
logging.level.org.hibernate.SQL=WARN
