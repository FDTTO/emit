# ================================================================
# application-test.properties — PERFIL DE TESTES
#
# Usado por @SpringBootTest nas suites de integração com Testcontainers.
# O banco real é provisionado pelo Testcontainers (PostgreSQL em Docker).
# A URL do banco é injetada dinamicamente via @DynamicPropertySource.
# ================================================================

# Desabilita Liquibase: Testcontainers provisionará o schema via
# @DynamicPropertySource + spring.liquibase.url dinâmica.
# Ou mantenha true se quiser que Liquibase rode contra o TC postgres.
spring.liquibase.enabled=true

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

logging.level.dev.emit=INFO
logging.level.org.hibernate.SQL=WARN
