# Integration tests: the datasource, Redis and Kafka addresses come from the
# Testcontainers instances at runtime, through @DynamicPropertySource.

spring.liquibase.enabled=true

spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.dev.emit=INFO
logging.level.org.hibernate.SQL=WARN

emit.security.jwt.secret=test-secret-minimum-32-characters-long-ok!
emit.security.jwt.expiration-ms=3600000
emit.admin.username=admin
emit.admin.password=admin123
