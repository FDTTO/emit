<!DOCTYPE html>
<html lang="en">
  <!--
    The page Prumo runs the console's scenarios in (prumo.json). Not part of
    the application: it is never compiled and never referenced by the app.

    Swagger UI renders nothing for a collapsed region, so this page boots the
    real bundles, theme.css and the console against the real /v3/api-docs with
    the operations listed and the schemas open. Prumo publishes it next to the
    app's static files for a run and removes it afterwards. A scenario sets
    window.scenarioConfig to run under other settings, another spec URL
    included.
  -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMIT console harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" type="text/css" href="/swagger/theme.css">
    <style>
      html { background-color: #07090d; }
      body { color: #aab6c6; margin: 0; }
    </style>
  </head>
  <body id="emit-swagger">
    <div id="swagger-ui"></div>
    <script>
      /* Virtual time starves requestAnimationFrame, and the console repaints
         through it, so checks would pass or fail at random. rAF runs on a
         timer here; the page itself is unchanged. */
      window.requestAnimationFrame = function (callback) {
        return setTimeout(function () { callback(performance.now()); }, 16);
      };
      window.cancelAnimationFrame = function (id) { clearTimeout(id); };
    </script>


    <script src="/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      /* Built from the config the app serves, so scenarios run under the
         settings a reader gets, unless a scenario sets window.scenarioConfig
         to run under others. configUrl is dropped because Swagger would
         fetch it again over what is set here. */
      window.onload = function () {
        fetch('/v3/api-docs/swagger-config').then(function (response) { return response.json(); }).then(function (served) {
          delete served.configUrl;
          window.ui = SwaggerUIBundle(Object.assign(served, {
            dom_id: '#swagger-ui',
            deepLinking: true,
            syntaxHighlight: { theme: 'nord' },
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            plugins: [SwaggerUIBundle.plugins.DownloadUrl],
            layout: 'StandaloneLayout',
            url: '/v3/api-docs',
            defaultModelsExpandDepth: 5,
            defaultModelExpandDepth: 5
          }, window.scenarioConfig || {}));
        });
      };
    </script>
    <script type="module" src="/swagger/emit.js"></script>
  </body>
</html>
