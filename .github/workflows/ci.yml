name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

  # The image the Dockerfile describes. Nothing else in CI runs it, so it is
  # built on every push, or a base image or a build step could rot unseen.
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag emit:ci .

  # The console's regression suite: the application on its real dependencies,
  # driven in headless Chrome by Prumo (tools/prumo). The Java tests cannot see
  # the theme or the console's behaviour; this is the only check that does.
  ui-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint the scripts and styles
        run: npx --yes @biomejs/biome@2.5.15 lint

      - uses: ./.github/actions/start-app

      - name: Run the UI suite
        run: python tools/prumo suite --jobs 2

      - name: Keep the application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app.log

  # The live demo: the running app recorded as a static site, its answers
  # held against the app's own, then published to GitHub Pages from main.
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./.github/actions/start-app

      - name: Record the application as the demo site
        run: python demo/export.py http://localhost:8080 site

      # Served under /emit/, as Pages serves it, so a path that only works
      # from the root fails here first.
      - name: Check the demo against the application
        run: python tools/prumo visit demo/accept.js --serve site --at /emit/ --wait 90000

      - name: Keep the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Keep the application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-application-log
          path: app.log

  publish-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ test, ui-suite, demo ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
