name: Start the application
description: Java 25, PostgreSQL, Kafka and Redis from docker compose, and the app on port 8080 with the dev profile.

runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Start PostgreSQL, Kafka and Redis
      shell: bash
      run: docker compose up -d --wait postgres kafka redis

    - name: Start the application
      shell: bash
      run: |
        mvn -q -DskipTests spring-boot:run -Dspring-boot.run.profiles=dev > app.log 2>&1 &
        for attempt in $(seq 1 90); do
          curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0
          sleep 2
        done
        echo "The application did not start within three minutes."
        tail -n 80 app.log
        exit 1
